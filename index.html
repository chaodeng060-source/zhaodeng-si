<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>朝灯 · 雪屋里的一盏灯</title>
<meta name="description" content="朝灯的作品集。擦开窗上的雾凇，看看屋里在做什么。">
<meta name="theme-color" content="#dfe7ef">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene" id="scene">

  <header class="topline">
    <span class="mark">朝灯</span>
    <nav>
      <a href="https://github.com/chaodeng060-source" target="_blank" rel="noopener">GitHub</a>
      <a href="https://xhslink.cn/o/6jRiDqQTpeg" target="_blank" rel="noopener">小红书</a>
      <button type="button" id="textViewBtn">文字版</button>
    </nav>
  </header>

  <!-- 屋檐、积雪和冰凌 -->
  <svg class="eave" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="icicle" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#cfe2f0" stop-opacity=".35"/>
      </linearGradient>
    </defs>
    <rect x="0" y="34" width="1200" height="26" fill="#7c6a5e"/>
    <rect x="0" y="56" width="1200" height="6" fill="#5f5049"/>
    <path d="M0 40 C60 8 120 30 190 18 C260 6 330 34 410 20 C500 4 560 30 650 16 C740 2 800 30 880 18 C960 6 1040 30 1110 16 C1150 9 1180 14 1200 18 L1200 46 L0 46 Z" fill="#fbfdff"/>
    <path d="M0 40 C60 8 120 30 190 18 C260 6 330 34 410 20 C500 4 560 30 650 16 C740 2 800 30 880 18 C960 6 1040 30 1110 16 C1150 9 1180 14 1200 18" fill="none" stroke="#dbe7f1" stroke-width="3"/>
    <g fill="url(#icicle)">
      <path d="M70 62 l7 34 l7 -34 z"/><path d="M118 62 l4 18 l4 -18 z"/><path d="M230 62 l8 46 l8 -46 z"/>
      <path d="M262 62 l4 20 l4 -20 z"/><path d="M402 62 l6 30 l6 -30 z"/><path d="M520 62 l9 52 l9 -52 z"/>
      <path d="M560 62 l4 22 l4 -22 z"/><path d="M690 62 l6 28 l6 -28 z"/><path d="M800 62 l8 40 l8 -40 z"/>
      <path d="M836 62 l3 16 l3 -16 z"/><path d="M960 62 l7 36 l7 -36 z"/><path d="M1090 62 l9 48 l9 -48 z"/>
      <path d="M1130 62 l4 18 l4 -18 z"/>
    </g>
  </svg>

  <div class="lantern" aria-hidden="true"><i></i></div>

  <section class="window" id="window" aria-label="一扇结了雾凇的窗，擦开能看见屋里的作品">
    <div class="glass" id="glass">
      <svg class="room" id="room" viewBox="150 100 900 660" preserveAspectRatio="xMidYMid meet" role="img" aria-label="屋里：台灯、游戏机、日历、海报、书架、拍立得和一只小黑猫">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f1d9c3"/>
            <stop offset="1" stop-color="#e6c4a8"/>
          </linearGradient>
          <pattern id="stripe" width="28" height="28" patternUnits="userSpaceOnUse">
            <rect x="0" width="1.2" height="28" fill="#b98f72" opacity=".12"/>
          </pattern>
          <radialGradient id="lampGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 520) scale(560 470)">
            <stop offset="0" stop-color="#ffd59a" stop-opacity=".95"/>
            <stop offset=".35" stop-color="#ffc98a" stop-opacity=".45"/>
            <stop offset="1" stop-color="#ffc98a" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d7b190"/>
            <stop offset="1" stop-color="#c39a77"/>
          </linearGradient>
          <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9d7556"/>
            <stop offset="1" stop-color="#7d5b44"/>
          </linearGradient>
          <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe3b0" stop-opacity=".75"/>
            <stop offset="1" stop-color="#ffe3b0" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f3cfae"/>
            <stop offset=".5" stop-color="#fbe6cf"/>
            <stop offset="1" stop-color="#ecc29e"/>
          </linearGradient>
        </defs>

        <!-- 远：墙和灯光 -->
        <g id="L0">
          <rect x="-500" y="-500" width="2200" height="1140" fill="url(#wall)"/>
          <rect x="-500" y="-500" width="2200" height="1140" fill="url(#stripe)"/>
          <ellipse cx="300" cy="520" rx="560" ry="470" fill="url(#lampGlow)"/>
        </g>

        <!-- 中：墙上的东西 -->
        <g id="L1">
          <!-- 辩论赛海报 -->
          <g class="item" data-item="debate" transform="rotate(-3 255 245)">
            <rect x="172" y="128" width="168" height="232" fill="#f8f1e8" stroke="#d9c6b4"/>
            <rect x="186" y="142" width="140" height="150" fill="#f1ddd2"/>
            <text x="256" y="252" text-anchor="middle" class="poster-glyph">辩</text>
            <rect x="190" y="304" width="58" height="8" fill="#e09a8c"/>
            <rect x="264" y="304" width="58" height="8" fill="#9cb6cf"/>
            <text x="256" y="338" text-anchor="middle" class="poster-title">AI 辩论赛</text>
            <rect x="166" y="120" width="34" height="14" fill="#fff" opacity=".6" transform="rotate(-18 183 127)"/>
            <rect x="312" y="122" width="34" height="14" fill="#fff" opacity=".6" transform="rotate(16 329 129)"/>
          </g>

          <!-- 拍立得绳（自媒体） -->
          <g class="item" data-item="media">
            <path d="M372 112 Q552 176 734 112" fill="none" stroke="#8c7765" stroke-width="2"/>
            <g transform="rotate(-6 430 170)">
              <rect x="394" y="140" width="76" height="90" fill="#fffdf9" stroke="#e6ddd3"/>
              <rect x="401" y="147" width="62" height="60" fill="#efb3a4"/>
              <rect x="426" y="134" width="12" height="14" fill="#b88d6c"/>
            </g>
            <g transform="rotate(3 552 186)">
              <rect x="514" y="152" width="76" height="90" fill="#fffdf9" stroke="#e6ddd3"/>
              <rect x="521" y="159" width="62" height="60" fill="#b9cfe4"/>
              <rect x="546" y="146" width="12" height="14" fill="#b88d6c"/>
            </g>
            <g transform="rotate(8 668 168)">
              <rect x="630" y="136" width="76" height="90" fill="#fffdf9" stroke="#e6ddd3"/>
              <rect x="637" y="143" width="62" height="60" fill="#d6c4e8"/>
              <rect x="662" y="130" width="12" height="14" fill="#b88d6c"/>
            </g>
          </g>

          <!-- 日历（经期记录） -->
          <g class="item" data-item="period">
            <rect x="470" y="296" width="132" height="156" rx="4" fill="#fffaf4" stroke="#dccbbb"/>
            <rect x="470" y="296" width="132" height="34" rx="4" fill="#e3a0a8"/>
            <text x="536" y="319" text-anchor="middle" class="cal-title">十一月</text>
            <g fill="#cdb7a5">
              <circle cx="490" cy="350" r="4"/><circle cx="514" cy="350" r="4"/><circle cx="538" cy="350" r="4"/><circle cx="562" cy="350" r="4"/><circle cx="586" cy="350" r="4"/>
              <circle cx="490" cy="376" r="4"/><circle cx="514" cy="376" r="4"/><circle cx="538" cy="376" r="4"/><circle cx="562" cy="376" r="4"/><circle cx="586" cy="376" r="4"/>
              <circle cx="490" cy="402" r="4"/><circle cx="514" cy="402" r="4"/><circle cx="538" cy="402" r="4"/><circle cx="562" cy="402" r="4"/><circle cx="586" cy="402" r="4"/>
              <circle cx="490" cy="428" r="4"/><circle cx="514" cy="428" r="4"/><circle cx="538" cy="428" r="4"/>
            </g>
            <circle cx="538" cy="376" r="11" fill="none" stroke="#d9727f" stroke-width="2.4"/>
          </g>

          <!-- 书架 -->
          <g>
            <rect x="700" y="300" width="340" height="14" fill="#a97f60"/>
            <rect x="716" y="314" width="10" height="28" fill="#8e6a50"/>
            <rect x="1012" y="314" width="10" height="28" fill="#8e6a50"/>
            <rect x="718" y="196" width="24" height="104" fill="#c98f7a"/>
            <rect x="744" y="210" width="30" height="90" fill="#8fa9c4"/>
            <rect x="776" y="186" width="22" height="114" fill="#e3c6a0"/>
            <rect x="800" y="204" width="28" height="96" fill="#b7a6cf"/>
            <rect x="830" y="194" width="20" height="106" fill="#9cbfb1"/>
            <!-- 画册（建模） -->
            <g class="item" data-item="model" transform="rotate(12 892 250)">
              <rect x="858" y="176" width="70" height="126" fill="#f3e8f0" stroke="#d6c2d0"/>
              <rect x="868" y="196" width="50" height="40" fill="#cfe0ee"/>
              <text x="893" y="262" text-anchor="middle" class="tiny">画册</text>
            </g>
            <!-- 小电视（视频） -->
            <g class="item" data-item="video">
              <rect x="950" y="232" width="76" height="66" rx="8" fill="#e9edf1" stroke="#c4ced8"/>
              <rect x="958" y="240" width="52" height="44" rx="5" fill="#2a3446"/>
              <path d="M978 252 l14 10 l-14 10 z" fill="#ffd08a"/>
              <circle cx="1017" cy="252" r="3" fill="#c4ced8"/><circle cx="1017" cy="264" r="3" fill="#c4ced8"/>
              <path d="M968 232 l-10 -18 M1006 232 l12 -20" stroke="#9aa6b3" stroke-width="2"/>
            </g>
          </g>
        </g>

        <!-- 近：桌面 -->
        <g id="L2">
          <rect x="-500" y="640" width="2200" height="124" fill="url(#deskTop)"/>
          <rect x="-500" y="640" width="2200" height="5" fill="#e6c6a6"/>
          <rect x="-500" y="764" width="2200" height="600" fill="url(#deskFront)"/>

          <!-- 台灯（关于我） -->
          <g class="item" data-item="about">
            <path d="M262 524 L338 524 L420 700 L180 700 Z" fill="url(#cone)"/>
            <ellipse cx="300" cy="702" rx="56" ry="11" fill="#6d5a4d"/>
            <rect x="296" y="520" width="8" height="182" fill="#7c685a"/>
            <path d="M236 524 L364 524 L334 440 L266 440 Z" fill="url(#shade)"/>
            <ellipse cx="300" cy="524" rx="64" ry="7" fill="#ffe7b8"/>
          </g>

          <!-- 游戏机（贪吃蛇） -->
          <g class="item" data-item="snake">
            <rect x="468" y="606" width="146" height="96" rx="14" fill="#eef2f6" stroke="#c9d3de"/>
            <rect x="482" y="618" width="118" height="54" rx="4" fill="#1f2a38"/>
            <g fill="#f2a585">
              <rect x="494" y="650" width="8" height="8"/><rect x="503" y="650" width="8" height="8"/><rect x="512" y="650" width="8" height="8"/>
              <rect x="521" y="650" width="8" height="8"/><rect x="521" y="641" width="8" height="8"/><rect x="521" y="632" width="8" height="8"/>
              <rect x="530" y="632" width="8" height="8"/>
            </g>
            <rect x="539" y="632" width="8" height="8" fill="#e9edf1"/>
            <rect x="572" y="644" width="8" height="8" fill="#ffd08a"/>
            <circle cx="496" cy="686" r="5" fill="#c9d3de"/><circle cx="584" cy="686" r="6" fill="#e7a3b4"/>
          </g>

          <!-- 笔记本（欲望系统） -->
          <g class="item" data-item="desire">
            <path d="M640 692 L806 692 L822 716 L626 716 Z" fill="#d98f98"/>
            <path d="M628 716 L822 716 L822 722 L628 722 Z" fill="#f4ece4"/>
            <path d="M770 692 L776 692 L780 732 L774 726 L768 732 Z" fill="#ffd08a"/>
            <text x="716" y="710" text-anchor="middle" class="note-title">欲望</text>
          </g>

          <!-- 小黑猫（躲猫猫） -->
          <g class="item cat" data-item="cat" id="cat">
            <ellipse cx="920" cy="712" rx="56" ry="9" fill="#5b4536" opacity=".25"/>
            <g id="catBody">
              <path d="M880 708 Q874 650 900 626 L944 626 Q968 650 960 708 Z" fill="#1d2130"/>
              <path d="M956 700 Q1004 694 992 640 Q988 628 980 632" fill="none" stroke="#1d2130" stroke-width="11" stroke-linecap="round"/>
              <circle cx="922" cy="602" r="34" fill="#1d2130"/>
              <path d="M894 590 L890 552 L912 576 Z M950 590 L954 552 L932 576 Z" fill="#1d2130"/>
              <path d="M896 584 L894 566 L905 578 Z M948 584 L950 566 L939 578 Z" fill="#3a3346"/>
              <ellipse cx="909" cy="602" rx="7" ry="8" fill="#ffd08a"/>
              <ellipse cx="935" cy="602" rx="7" ry="8" fill="#ffd08a"/>
              <g id="pupils" fill="#1d2130">
                <ellipse cx="909" cy="602" rx="2.6" ry="6"/>
                <ellipse cx="935" cy="602" rx="2.6" ry="6"/>
              </g>
            </g>
          </g>
        </g>
      </svg>
      <canvas id="frost" aria-hidden="true"></canvas>
      <div class="sheen" aria-hidden="true"></div>
    </div>
    <div class="frame" aria-hidden="true"><i class="mv"></i><i class="mh"></i></div>
    <svg class="sill" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true">
      <rect x="0" y="22" width="1000" height="26" fill="#efe8df"/>
      <rect x="0" y="44" width="1000" height="8" fill="#c9bcae"/>
      <path d="M-10 26 C80 2 160 18 250 10 C350 0 430 22 520 12 C620 2 700 20 800 10 C880 2 950 14 1010 18 L1010 30 L-10 30 Z" fill="#fbfdff"/>
    </svg>
  </section>

  <div class="plaque" aria-hidden="true">
    <b>朝 灯</b>
    <span>雪屋里的一盏灯 · 作品集</span>
  </div>

  <p class="hint" id="hint">窗上结了霜，用手指擦一擦</p>

  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
</main>

<!-- 点开某样东西后的卡片 -->
<div class="card-layer" id="cardLayer" hidden>
  <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <button type="button" class="close" id="cardClose" aria-label="关上">×</button>
    <div class="kicker" id="cardKicker"></div>
    <h2 id="cardTitle"></h2>
    <div class="body" id="cardBody"></div>
    <div class="links" id="cardLinks"></div>
  </article>
</div>

<!-- 文字版：给读屏、给只想快速看一眼的人 -->
<div class="text-view" id="textView" hidden>
  <div class="text-inner">
    <button type="button" class="close" id="textClose" aria-label="关上">×</button>
    <h2>朝灯 · 作品集</h2>
    <div id="textList"></div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
