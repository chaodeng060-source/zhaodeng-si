<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>朝灯 · 雪屋里的一盏灯</title>
<meta name="description" content="朝灯的作品集。擦开窗上的雾凇，看看屋里在做什么。">
<meta name="theme-color" content="#dfe7ef">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 几层共用的渐变、贴图和滤镜 -->
<svg class="defs" width="0" height="0" aria-hidden="true">
  <defs>
    <pattern id="wallpaper" patternUnits="userSpaceOnUse" width="180" height="180">
      <image href="assets/wall.jpg" width="180" height="180"/>
    </pattern>
    <pattern id="wood" patternUnits="userSpaceOnUse" width="560" height="140">
      <image href="assets/wood.jpg" width="560" height="140" preserveAspectRatio="none"/>
    </pattern>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="150" height="150">
      <image href="assets/paper.jpg" width="150" height="150"/>
    </pattern>

    <filter id="wallShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="5" dy="7" stdDeviation="5" flood-color="#3e2430" flood-opacity=".32"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#3e2430" flood-opacity=".3"/>
    </filter>

    <linearGradient id="wallFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c2028" stop-opacity="0"/>
      <stop offset="1" stop-color="#3c2028" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="deskShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a140c" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#2a140c" stop-opacity=".12"/>
      <stop offset=".85" stop-color="#fff2dc" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff2dc" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a140c" stop-opacity=".45"/>
      <stop offset=".25" stop-color="#2a140c" stop-opacity=".62"/>
      <stop offset="1" stop-color="#1c0e0a" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".75" stop-color="#000" stop-opacity=".1"/>
      <stop offset="1" stop-color="#000" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3df" stop-opacity=".35"/>
      <stop offset=".2" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a140c" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="contact">
      <stop offset="0" stop-color="#2a140c" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#2a140c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2a140c" stop-opacity="0"/>
    </radialGradient>

    <!-- 台灯 -->
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d79c"/>
      <stop offset=".3" stop-color="#d9a860"/>
      <stop offset=".7" stop-color="#9b6c38"/>
      <stop offset="1" stop-color="#5e3f22"/>
    </linearGradient>
    <linearGradient id="shadeFab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2dc"/>
      <stop offset=".45" stop-color="#ffe2c0"/>
      <stop offset="1" stop-color="#e0a98a"/>
    </linearGradient>
    <linearGradient id="shadeIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff6de" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#ffe2ad" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#ffc98a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffc98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#fff4d2"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>

    <!-- 杯子、游戏机、小电视 -->
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f1ea"/>
      <stop offset=".35" stop-color="#dfe9f2"/>
      <stop offset="1" stop-color="#8ea5bd"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset=".55" stop-color="#e7e2dc"/>
      <stop offset="1" stop-color="#b9b2ab"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26363d"/>
      <stop offset="1" stop-color="#17232a"/>
    </linearGradient>
    <linearGradient id="glassGlare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7a5a6"/>
      <stop offset="1" stop-color="#b56c78"/>
    </linearGradient>

    <!-- 小黑猫 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46333a"/>
      <stop offset=".28" stop-color="#22222f"/>
      <stop offset="1" stop-color="#101119"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf98" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#ffc184" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffb47a" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="iris" cx=".45" cy=".4" r=".65">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".55" stop-color="#f3c658"/>
      <stop offset="1" stop-color="#c3832a"/>
    </radialGradient>
    <radialGradient id="bulbGlow">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffd58c" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffc06a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tvGlow">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>

    <!-- 拍立得里的小画 -->
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1a7a0"/>
      <stop offset=".6" stop-color="#fbd2b4"/>
      <stop offset="1" stop-color="#fde8cf"/>
    </linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3657"/>
      <stop offset="1" stop-color="#6a6b93"/>
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6cbec"/>
      <stop offset="1" stop-color="#f3d9df"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c7b4"/>
      <stop offset=".55" stop-color="#e8d9ec"/>
      <stop offset="1" stop-color="#c6dcef"/>
    </linearGradient>
    <clipPath id="ph1"><rect x="401" y="141" width="62" height="60"/></clipPath>
    <clipPath id="ph2"><rect x="521" y="155" width="62" height="60"/></clipPath>
    <clipPath id="ph3"><rect x="637" y="143" width="62" height="60"/></clipPath>
    <clipPath id="painting"><rect x="212" y="-76" width="110" height="76"/></clipPath>
    <path id="leaf" d="M0 0 C-7 -4 -9 -13 0 -19 C9 -13 7 -4 0 0 Z"/>
    <clipPath id="tvScreen"><rect x="959" y="242" width="50" height="42" rx="7"/></clipPath>
  </defs>
</svg>

<main class="scene" id="scene">

  <header class="topline">
    <span class="mark">朝灯</span>
    <nav>
      <a href="https://github.com/chaodeng060-source" target="_blank" rel="noopener">GitHub</a>
      <a href="https://xhslink.cn/o/6jRiDqQTpeg" target="_blank" rel="noopener">小红书</a>
      <button type="button" id="textViewBtn">文字版</button>
    </nav>
  </header>

  <!-- 屋檐、积雪和冰凌 -->
  <svg class="eave" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="icicle" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#cfe2f0" stop-opacity=".35"/>
      </linearGradient>
      <linearGradient id="eaveWood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8a7266"/>
        <stop offset="1" stop-color="#5a4740"/>
      </linearGradient>
    </defs>
    <rect x="0" y="34" width="1200" height="28" fill="url(#eaveWood)"/>
    <path d="M0 40 C60 8 120 30 190 18 C260 6 330 34 410 20 C500 4 560 30 650 16 C740 2 800 30 880 18 C960 6 1040 30 1110 16 C1150 9 1180 14 1200 18 L1200 46 L0 46 Z" fill="#fbfdff"/>
    <path d="M0 40 C60 8 120 30 190 18 C260 6 330 34 410 20 C500 4 560 30 650 16 C740 2 800 30 880 18 C960 6 1040 30 1110 16 C1150 9 1180 14 1200 18" fill="none" stroke="#dbe7f1" stroke-width="3"/>
    <g fill="url(#icicle)">
      <path d="M70 62 l7 34 l7 -34 z"/><path d="M118 62 l4 18 l4 -18 z"/><path d="M230 62 l8 46 l8 -46 z"/>
      <path d="M262 62 l4 20 l4 -20 z"/><path d="M402 62 l6 30 l6 -30 z"/><path d="M520 62 l9 52 l9 -52 z"/>
      <path d="M560 62 l4 22 l4 -22 z"/><path d="M690 62 l6 28 l6 -28 z"/><path d="M800 62 l8 40 l8 -40 z"/>
      <path d="M836 62 l3 16 l3 -16 z"/><path d="M960 62 l7 36 l7 -36 z"/><path d="M1090 62 l9 48 l9 -48 z"/>
      <path d="M1130 62 l4 18 l4 -18 z"/>
    </g>
  </svg>

  <div class="lantern" aria-hidden="true"><i></i></div>

  <section class="window" id="window" aria-label="一扇结了雾凇的窗，擦开能看见屋里的作品">
    <div class="spill" aria-hidden="true"></div>
    <div class="glass" id="glass" role="img" aria-label="屋里：台灯、杯子、游戏机、笔记本、日历、海报、书架、拍立得和一只小黑猫">

      <!-- 远：墙 -->
      <svg class="layer" id="L0" viewBox="150 100 900 660" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <rect x="-200" y="-260" width="1600" height="910" fill="url(#wallpaper)"/>
        <rect x="-200" y="560" width="1600" height="90" fill="url(#wallFoot)"/>
      </svg>

      <!-- 中：墙上的东西 -->
      <svg class="layer" id="L1" viewBox="150 100 900 660" preserveAspectRatio="xMidYMid meet" aria-hidden="true">

        <!-- 竖着看（手机）才露出来的上半面墙：一幅小画、一只钟、一盆吊兰 -->
        <g filter="url(#wallShadow)">
          <rect x="196" y="-92" width="142" height="108" fill="#d9bfa0"/>
          <rect x="204" y="-84" width="126" height="92" fill="#fbf6ee"/>
          <g clip-path="url(#painting)">
            <rect x="212" y="-76" width="110" height="76" fill="url(#duskSky)"/>
            <circle cx="292" cy="-48" r="9" fill="#fff3dc"/>
            <path d="M212 -30 Q240 -40 266 -34 Q296 -28 322 -38 V0 H212 Z" fill="#f4f8fc"/>
            <path d="M212 -20 H322 V0 H212 Z" fill="#c9dcec"/>
            <path d="M212 -20 H322" stroke="#fff" stroke-width="1" opacity=".8"/>
            <rect x="244" y="-22" width="40" height="3" fill="#8a6c5c"/>
            <rect x="248" y="-19" width="2" height="10" fill="#8a6c5c"/><rect x="278" y="-19" width="2" height="10" fill="#8a6c5c"/>
            <path d="M274 -22 c-4 0 -5 -5 -3 -8 c-1 -1 -1 -4 0 -5 l0 -3 l2 2 h3 l2 -2 l0 3 c1 1 1 4 0 5 c2 3 1 8 -4 8 z" fill="#1d1f2b"/>
          </g>
        </g>
        <g id="clock" filter="url(#wallShadow)">
          <circle cx="470" cy="-38" r="38" fill="#fbf6ef" stroke="#c9a46e" stroke-width="5"/>
          <g stroke="#8e7c72" stroke-linecap="round" id="ticks"></g>
          <line id="hourHand" x1="470" y1="-38" x2="470" y2="-58" stroke="#3f3448" stroke-width="3.4" stroke-linecap="round"/>
          <line id="minHand" x1="470" y1="-38" x2="470" y2="-66" stroke="#3f3448" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="470" cy="-38" r="3" fill="#e39ba6"/>
        </g>
        <g class="plant">
          <path d="M904 -300 L882 -44 M904 -300 L926 -44 M904 -300 L904 -44" stroke="#c9ab88" stroke-width="1.4" fill="none"/>
          <path d="M878 -46 H930 L924 -10 Q904 -2 884 -10 Z" fill="#f1e6da"/>
          <path d="M878 -46 H930 L929 -40 H879 Z" fill="#d9c8b6"/>
          <g fill="none" stroke="#5f8a6a" stroke-width="1.6">
            <path d="M886 -40 C874 0 868 50 872 112"/>
            <path d="M920 -40 C934 -4 940 40 932 84"/>
            <path d="M904 -38 C902 -10 900 10 906 34"/>
          </g>
          <g fill="#7fae86">
            <use href="#leaf" transform="translate(880 -34) rotate(-40)"/><use href="#leaf" transform="translate(896 -44) rotate(-12)"/>
            <use href="#leaf" transform="translate(912 -46) rotate(14)"/><use href="#leaf" transform="translate(926 -38) rotate(42)"/>
            <use href="#leaf" transform="translate(876 -4) rotate(150) scale(.9)"/><use href="#leaf" transform="translate(871 34) rotate(210) scale(.85)"/>
            <use href="#leaf" transform="translate(870 70) rotate(160) scale(.8)"/><use href="#leaf" transform="translate(873 108) rotate(200) scale(.75)"/>
            <use href="#leaf" transform="translate(934 0) rotate(200) scale(.9)"/><use href="#leaf" transform="translate(939 44) rotate(150) scale(.85)"/>
            <use href="#leaf" transform="translate(933 82) rotate(190) scale(.75)"/><use href="#leaf" transform="translate(902 4) rotate(170) scale(.8)"/>
            <use href="#leaf" transform="translate(906 32) rotate(200) scale(.7)"/>
          </g>
          <g fill="#a9cfa6" opacity=".7">
            <use href="#leaf" transform="translate(896 -44) rotate(-12) scale(.5)"/><use href="#leaf" transform="translate(871 34) rotate(210) scale(.45)"/>
            <use href="#leaf" transform="translate(939 44) rotate(150) scale(.45)"/>
          </g>
        </g>

        <!-- 辩论赛海报 -->
        <g class="item" data-item="debate">
          <g transform="rotate(-3 256 244)">
            <g filter="url(#wallShadow)">
              <rect x="172" y="128" width="168" height="232" fill="#fbf5ed"/>
              <path d="M186 142 H326 V194 L186 270 Z" fill="#f2c2b4"/>
              <path d="M186 270 L326 194 V292 H186 Z" fill="#b9d0e6"/>
              <text x="198" y="160" class="poster-side">正方</text>
              <text x="314" y="284" text-anchor="end" class="poster-side">反方</text>
              <text x="256" y="252" text-anchor="middle" class="poster-glyph">辩</text>
              <text x="256" y="320" text-anchor="middle" class="poster-title">AI 辩论赛</text>
              <text x="256" y="340" text-anchor="middle" class="poster-sub">抽签 · 立论 · 质询 · 盲审</text>
              <rect x="172" y="128" width="168" height="232" fill="url(#paper)" class="mul"/>
            </g>
            <rect x="166" y="120" width="36" height="14" fill="#f6e7cf" opacity=".75" transform="rotate(-18 184 127)"/>
            <rect x="310" y="122" width="36" height="14" fill="#f6e7cf" opacity=".75" transform="rotate(16 328 129)"/>
          </g>
        </g>

        <!-- 拍立得（自媒体） -->
        <path d="M360 108 Q552 180 746 108" fill="none" stroke="#7a6252" stroke-width="1.6"/>
        <g class="item" data-item="media">
          <g transform="rotate(-6 432 178)" filter="url(#softShadow)">
            <rect x="394" y="134" width="76" height="92" fill="#fffdf8"/>
            <g clip-path="url(#ph1)">
              <rect x="401" y="141" width="62" height="60" fill="url(#duskSky)"/>
              <circle cx="446" cy="170" r="8" fill="#fff4dc"/>
              <path d="M401 186 Q420 175 440 183 Q454 189 463 180 V201 H401 Z" fill="#f8fbff"/>
              <path d="M410 186 h12 v-8 l-6 -6 l-6 6 z" fill="#8a6c5c"/>
              <path d="M408 179 l8 -8 l8 8" fill="none" stroke="#f8fbff" stroke-width="2.4"/>
              <rect x="414" y="180" width="4" height="4" fill="#ffd08a"/>
            </g>
            <rect x="394" y="134" width="76" height="92" fill="url(#paper)" class="mul"/>
            <text x="432" y="218" text-anchor="middle" class="polaroid-label">人机恋</text>
          </g>
          <g transform="rotate(3 552 192)" filter="url(#softShadow)">
            <rect x="514" y="148" width="76" height="92" fill="#fffdf8"/>
            <g clip-path="url(#ph2)">
              <rect x="521" y="155" width="62" height="60" fill="url(#nightSky)"/>
              <circle cx="568" cy="170" r="6.5" fill="#fff4d6"/>
              <g fill="#cf5a52">
                <rect x="531" y="176" width="40" height="4" rx="1.5"/>
                <rect x="534" y="183" width="34" height="2.6"/>
                <rect x="537" y="179" width="3.4" height="30"/>
                <rect x="562" y="179" width="3.4" height="30"/>
              </g>
              <path d="M521 206 Q552 200 583 206 V215 H521 Z" fill="#eef3f9"/>
              <circle cx="530" cy="164" r=".9" fill="#fff"/><circle cx="548" cy="160" r=".7" fill="#fff"/><circle cx="578" cy="186" r=".7" fill="#fff"/>
            </g>
            <rect x="514" y="148" width="76" height="92" fill="url(#paper)" class="mul"/>
            <text x="552" y="232" text-anchor="middle" class="polaroid-label">阴阳师</text>
          </g>
          <g transform="rotate(8 668 180)" filter="url(#softShadow)">
            <rect x="630" y="136" width="76" height="92" fill="#fffdf8"/>
            <g clip-path="url(#ph3)">
              <rect x="637" y="143" width="62" height="60" fill="url(#lilac)"/>
              <path d="M650 203 V166 Q668 148 686 166 V203 Z" fill="#fff6e6" opacity=".9"/>
              <path d="M668 203 c-9 0 -10 -10 -7 -16 c-3 -2 -3 -7 -1 -9 l-1 -6 l4 4 h6 l4 -4 l-1 6 c2 2 2 7 -1 9 c3 6 2 16 -7 16 z" fill="#1d1f2b"/>
              <path d="M674 201 q10 -2 8 -12" fill="none" stroke="#1d1f2b" stroke-width="2.4" stroke-linecap="round"/>
              <rect x="637" y="199" width="62" height="4" fill="#c9b3a0"/>
            </g>
            <rect x="630" y="136" width="76" height="92" fill="url(#paper)" class="mul"/>
            <text x="668" y="220" text-anchor="middle" class="polaroid-label">B 站 · 抖音</text>
          </g>
          <!-- 木夹子 -->
          <g fill="#c9a27e" stroke="#9c7655" stroke-width=".8">
            <rect x="425" y="122" width="9" height="20" rx="2" transform="rotate(-6 430 132)"/>
            <rect x="548" y="136" width="9" height="20" rx="2" transform="rotate(3 552 146)"/>
            <rect x="660" y="125" width="9" height="20" rx="2" transform="rotate(8 664 135)"/>
          </g>
        </g>

        <!-- 记忆森林：拍立得底下挂一幅装框的全景图 -->
        <g class="item" data-item="forest">
          <g transform="rotate(1.5 450 306)" filter="url(#wallShadow)">
            <rect x="382" y="262" width="136" height="90" fill="#c99d63"/>
            <rect x="382" y="262" width="136" height="90" fill="url(#plank)" opacity=".6"/>
            <rect x="388" y="268" width="124" height="78" fill="#f3e6d2"/>
            <image href="assets/forest-map.jpg" x="391" y="271" width="118" height="72" preserveAspectRatio="xMidYMid slice"/>
            <rect x="391" y="271" width="118" height="72" fill="url(#glassGlare)"/>
          </g>
        </g>

        <!-- 日历（经期记录），挂在台灯旁边的墙上，避开窗框 -->
        <g class="item" data-item="period" transform="translate(-26 116)">
          <path d="M536 272 L472 300 M536 272 L600 300" stroke="#7a6252" stroke-width="1.2" fill="none"/>
          <circle cx="536" cy="271" r="3" fill="#8f7a6a"/>
          <g filter="url(#wallShadow)">
            <rect x="466" y="296" width="140" height="172" rx="3" fill="#fffaf3"/>
            <rect x="466" y="296" width="140" height="36" rx="3" fill="#e39ba6"/>
            <rect x="466" y="320" width="140" height="12" fill="#e39ba6"/>
            <text x="536" y="320" text-anchor="middle" class="cal-title" id="calTitle">十一月</text>
            <g id="calGrid"></g>
            <rect x="466" y="296" width="140" height="172" fill="url(#paper)" class="mul"/>
          </g>
          <g fill="none" stroke="#6d6470" stroke-width="2">
            <path d="M486 300 v-8 a3 3 0 0 1 6 0 v8"/><path d="M512 300 v-8 a3 3 0 0 1 6 0 v8"/>
            <path d="M554 300 v-8 a3 3 0 0 1 6 0 v8"/><path d="M580 300 v-8 a3 3 0 0 1 6 0 v8"/>
          </g>
        </g>

        <!-- 书架 -->
        <g>
